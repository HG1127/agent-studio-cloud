name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Next 16 的 LayoutProps 等路由类型由 typegen 生成（.next/ 不入库），tsc 前必须先生成
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          # 构建期仅要求变量存在（db 模块导入即校验），占位值不发起真实连接
          DATABASE_URL_POOLED: postgresql://build:build@localhost:5432/build

  integration:
    runs-on: ubuntu-latest
    needs: ci
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 跳过提示（未配置 NEON_API_KEY 时）
        if: env.NEON_API_KEY == ''
        run: echo "NEON_API_KEY 未配置，跳过集成测试"
      - name: 创建 Neon 临时分支
        if: env.NEON_API_KEY != ''
        # neonctl v5 的 --output json 输出单个合并对象，connection_uris[0] 是含
        # connection_uri 字段的对象；INFO/WARNING 日志走 stderr，stdout 为纯 JSON。
        # --suspend-timeout 3600：playwright install 期间数分钟无 DB 活动，
        # 默认 300s 即挂起计算，冷启动首查会 ECONNRESET（本地实测复现两次）
        run: |
          npx neonctl branches create --name ci-${{ github.run_id }} --project-id ${{ vars.NEON_PROJECT_ID }} --api-key "$NEON_API_KEY" --output json --suspend-timeout 3600 > branch.json
          echo "BRANCH_URL=$(jq -r '.connection_uris[0].connection_uri' branch.json)" >> "$GITHUB_ENV"
      - name: 迁移 + 集成测试 + E2E
        if: env.NEON_API_KEY != '' && env.BRANCH_URL != ''
        env:
          DATABASE_URL: ${{ env.BRANCH_URL }}
          DATABASE_URL_POOLED: ${{ env.BRANCH_URL }}
          MODEL_MOCK: "1"
        run: |
          pnpm db:migrate
          pnpm exec next typegen
          pnpm test:workflow
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: 删除临时分支
        if: always() && env.NEON_API_KEY != '' && env.BRANCH_URL != ''
        # neonctl v5 删除分支无交互确认（源码直连 API），没有 --force 选项
        run: npx neonctl branches delete ci-${{ github.run_id }} --project-id ${{ vars.NEON_PROJECT_ID }} --api-key "$NEON_API_KEY"
