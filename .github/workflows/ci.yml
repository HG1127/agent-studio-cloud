name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      # Next 16 的 LayoutProps 等路由类型由 typegen 生成（.next/ 不入库），tsc 前必须先生成
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - name: MVP 恢复假服务回归
        run: pnpm exec vitest run --config tests/helpers/mvp-acceptance-recovery.config.mts --maxWorkers=1
      - run: pnpm build
        env:
          # 构建期仅要求变量存在（db 模块导入即校验），占位值不发起真实连接
          DATABASE_URL_POOLED: postgresql://build:build@localhost:5432/build

  integration:
    runs-on: ubuntu-latest
    needs: ci
    # 隔离数据库和真实 Workflow 顺序执行，扩展回归已超过 30 分钟。
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 检查 Neon 集成测试配置
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          if [[ -z "$NEON_API_KEY" || -z "$NEON_PROJECT_ID" ]]; then
            echo "::error::NEON_API_KEY 或 NEON_PROJECT_ID 未配置，无法运行集成测试"
            exit 1
          fi
      - name: 创建 Neon 临时分支
        # 锁 @5 major：v5 会静默吞未知 flag，不锁则未来升级可能静默破坏调用参数
        run: |
          CI_BRANCH="ci-${{ github.run_id }}-${{ github.run_attempt }}"
          npx --yes neonctl@5 branches create --name "$CI_BRANCH" --project-id ${{ vars.NEON_PROJECT_ID }} --api-key "$NEON_API_KEY" --output json > /dev/null
          # 分支会复制主库数据；在临时分支上新建空库，避免线上数据与固定集成测试夹具冲突。
          npx --yes neonctl@5 databases create --name ci_test --branch "$CI_BRANCH" --project-id ${{ vars.NEON_PROJECT_ID }} --owner-name neondb_owner --api-key "$NEON_API_KEY" --output json > /dev/null
          BRANCH_URL=$(npx --yes neonctl@5 connection-string "$CI_BRANCH" --project-id ${{ vars.NEON_PROJECT_ID }} --database-name ci_test --role-name neondb_owner --api-key "$NEON_API_KEY")
          if [[ "$BRANCH_URL" != postgres://* && "$BRANCH_URL" != postgresql://* ]]; then
            echo "::error::Neon 临时分支未返回有效连接串"
            exit 1
          fi
          echo "::add-mask::$BRANCH_URL"
          echo "BRANCH_URL=$BRANCH_URL" >> "$GITHUB_ENV"
          MODEL_ENCRYPTION_KEY=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')
          echo "::add-mask::$MODEL_ENCRYPTION_KEY"
          echo "MODEL_ENCRYPTION_KEY=$MODEL_ENCRYPTION_KEY" >> "$GITHUB_ENV"
          CRON_SECRET=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')
          echo "::add-mask::$CRON_SECRET"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"
      - name: 迁移本次临时空库
        env:
          DATABASE_URL: ${{ env.BRANCH_URL }}
          DATABASE_URL_POOLED: ${{ env.BRANCH_URL }}
          MODEL_MOCK: "1"
        run: |
          pnpm db:migrate
          pnpm exec next typegen
      - name: 隔离数据库完整集成验收
        env:
          DATABASE_URL: ${{ env.BRANCH_URL }}
          DATABASE_URL_POOLED: ${{ env.BRANCH_URL }}
          MODEL_MOCK: "1"
          MVP_ACCEPTANCE_ISOLATED_DB: "1"
        run: pnpm exec vitest run --config vitest.integration.config.mts --maxWorkers=1 --reporter=default --reporter=json --outputFile=integration-results.json
      - name: 实际 Workflow 完整验收
        env:
          DATABASE_URL: ${{ env.BRANCH_URL }}
          DATABASE_URL_POOLED: ${{ env.BRANCH_URL }}
          MODEL_MOCK: "1"
          MVP_ACCEPTANCE_ISOLATED_DB: "1"
        run: pnpm exec vitest run --config vitest.workflow.config.mts --maxWorkers=1 --reporter=default --reporter=json --outputFile=workflow-results.json
      - name: 核对 MVP 真实断言未缺失或跳过
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const expected = [
            ['integration-results.json', 'tests/integration/mvp-acceptance-template-persistence.test.ts', 5],
            ['workflow-results.json', 'tests/workflow/mvp-acceptance-runtime.test.ts', 11],
            ['workflow-results.json', 'tests/workflow/mvp-acceptance-production-template.test.ts', 13],
            ['workflow-results.json', 'tests/workflow/mvp-acceptance-template-recovery.test.ts', 4],
            ['integration-results.json', 'tests/integration/mcp-registered-tool-names.test.ts', 3],
            ['workflow-results.json', 'tests/workflow/mcp-registered-tool-names.test.ts', 3],
            ['workflow-results.json', 'tests/workflow/mvp-acceptance-zero-argument-read.test.ts', 2],
          ];
          for (const [report, file, count] of expected) {
            const results = JSON.parse(fs.readFileSync(report, 'utf8'));
            const suites = results.testResults.filter(suite => suite.name.replaceAll('\\', '/').endsWith('/' + file));
            const assertions = suites.flatMap(suite => suite.assertionResults);
            if (!results.success || assertions.length !== count || assertions.some(test => test.status !== 'passed')) {
              throw new Error(file + ': 真实断言缺失、跳过或失败');
            }
            console.log(file + ': ' + count + ' 项实际通过');
          }
          NODE
      - name: 浏览器完整验收
        env:
          DATABASE_URL: ${{ env.BRANCH_URL }}
          DATABASE_URL_POOLED: ${{ env.BRANCH_URL }}
          MODEL_MOCK: "1"
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: 删除临时分支
        if: always() && env.NEON_API_KEY != '' && vars.NEON_PROJECT_ID != ''
        # neonctl v5 删除分支无交互确认（源码直连 API），没有 --force 选项
        # 守卫不看 BRANCH_URL：分支名由 run_id 与 run_attempt 确定，create 成功但取 URL 失败时同样要能清理
        run: |
          CI_BRANCH="ci-${{ github.run_id }}-${{ github.run_attempt }}"
          npx --yes neonctl@5 branches delete "$CI_BRANCH" --project-id ${{ vars.NEON_PROJECT_ID }} --api-key "$NEON_API_KEY"
